name: hermes-agentmemory-capture
version: 0.1.0
description: "Captura automática de sesiones y herramientas de Hermes hacia el backend AgentMemory (port de agentmemory-capture de OpenCode)."
requires_env:
  - AGENTMEMORY_URL
  - AGENTMEMORY_SECRET
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - subagent_start
  - subagent_stop
